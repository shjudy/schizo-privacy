<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Store로 이동</title>
<style>
  body { background:#0a0a0c; color:#e8e8ea; font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         padding:32px; text-align:center; line-height:1.8; }
  a.big { display:inline-block; margin-top:16px; padding:14px 26px; border:1px solid #4a4a52;
          border-radius:12px; color:#fff; text-decoration:none; font-weight:700; font-size:17px; }
  .hint { color:#8b8b93; font-size:13.5px; margin-top:28px; max-width:330px; }
  .hint strong { color:#c9c9ce; }
</style>
</head>
<body>
<p id="msg">App Store로 이동합니다</p>
<a class="big" id="storeLink" href="#">App Store에서 열기 →</a>
<p class="hint">버튼이 반응하지 않으면 — 화면 우측 상단 <strong>⋯ 메뉴</strong> →
<strong>'외부 브라우저로 열기'</strong>를 누르면 확실하게 열립니다.</p>
<script>
(function(){
  var m = location.search.match(/[?&]p=([^&]+)/);
  var path = m ? decodeURIComponent(m[1]) : "";
  // 화이트리스트: apps.apple.com 경로 형식만 (오픈 리다이렉트 방지)
  if(!/^([a-z]{2}\/)?app\/[a-z0-9._-]*\/?id\d+$/i.test(path)){ location.replace("./"); return; }
  // 캠페인 토큰(Q1 — 3회차) — ASC 캠페인 링크의 pt/ct/mt만 통과(그 외 쿼리는 버린다).
  // 화이트리스트 통과 "후" 재부착이라 오픈 리다이렉트 면적 불변.
  var tm = location.search.match(/[?&]t=([^&]+)/);
  var tok = tm ? decodeURIComponent(tm[1]) : "";
  if(!/^pt=\d+(&ct=[A-Za-z0-9._-]+)?(&mt=\d+)?$/.test(tok)) tok = "";
  var q = tok ? "?" + tok : "";
  var web   = "https://apps.apple.com/" + path + q;
  var web2  = "https://itunes.apple.com/" + path + q;   // 구 도메인 — 차단 목록 밖일 수 있음
  var itms  = "itms-appss://apps.apple.com/" + path + q;
  var a = document.getElementById("storeLink");
  a.href = web;
  // 버튼 = 사용자 제스처 컨텍스트에서 스킴 → 구 도메인 → 신 도메인 순서로 재발사
  a.addEventListener("click", function(e){
    e.preventDefault();
    location.href = itms;
    setTimeout(function(){ location.href = web2; }, 400);
    setTimeout(function(){ location.href = web;  }, 900);
  });
  // 자동 시도(성공하면 화면을 떠나므로 무해)
  location.href = itms;
  setTimeout(function(){ location.href = web2; }, 400);
})();
</script>
</body>
</html>
